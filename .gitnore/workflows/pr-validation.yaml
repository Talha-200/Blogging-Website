name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  lint:
    name: Lint HTML & CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install htmlhint stylelint stylelint-config-standard --save-dev

      - name: Run HTMLHint
        run: npx htmlhint "src/**/*.html"

      - name: Run Stylelint
        run: npx stylelint "styles/**/*.css"

  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install parcel --save-dev

      - name: Build with Parcel
        run: npx parcel build src/index.html --no-cache
